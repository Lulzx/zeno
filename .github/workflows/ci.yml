name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-14  # Apple Silicon (M1) runner for Metal GPU access
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Compile offline Metal shader artifact
        run: zig build metallib

      - name: Zig tests
        run: zig build test
        env:
          # Metal API validation catches invalid dispatches/bindings in CI.
          MTL_DEBUG_LAYER: "1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ABI contract check
        run: python tests/check_abi_contract.py

      - name: Install Python package and all test integrations
        run: pip install -e 'python[all]'

      - name: Python, Gymnasium, and SB3 integration tests
        run: ./scripts/test_python.sh

      - name: Build and smoke-test distributable wheel
        run: |
          mkdir -p dist
          python -m pip wheel ./python --no-deps --wheel-dir dist
          python -m venv /tmp/zeno-wheel-smoke
          /tmp/zeno-wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/zeno-wheel-smoke/bin/python -c 'import zeno; env = zeno.make("pendulum", num_envs=2); env.reset(); env.close()'

      - name: Build documentation strictly
        run: |
          pip install -r docs/requirements.txt
          python -m mkdocs build --strict

  benchmarks:
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run benchmarks
        run: zig build bench
